# Tags each release: when main changes, read _BUILD_VERSION from js/app.js and
# create that tag (e.g. v5) on the new commit if it doesn't exist yet.
# Run it by hand (Actions → Tag version → Run workflow) to tag an older commit,
# e.g. tag v1 on 44a2c63.
name: Tag version
on:
  push:
    branches: [main]
    paths: [js/app.js]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create, e.g. v1'
        required: true
      commit:
        description: 'Commit to tag (SHA)'
        required: true
permissions:
  contents: write
jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create tag
        env:
          IN_TAG: ${{ inputs.tag }}
          IN_COMMIT: ${{ inputs.commit }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            v="$IN_TAG"; sha=$(git rev-parse --verify "$IN_COMMIT^{commit}")
          else
            v=$(grep -oP "_BUILD_VERSION = '\K[^']+" js/app.js); sha="$GITHUB_SHA"
          fi
          if ! [[ "$v" =~ ^v[0-9]+$ ]]; then echo "Bad tag: $v"; exit 1; fi
          if git rev-parse -q --verify "refs/tags/$v" >/dev/null; then
            echo "$v already tagged"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$v" -m "joiner $v" "$sha"
          git push origin "$v"
